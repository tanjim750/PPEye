</head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col flex-1 relative w-full px-container-padding bg-surface justify-center"><div class="flex flex-col w-full justify-between py-8 min-h-[707px]"><div class="flex flex-col w-full justify-between py-8 min-h-[707px]">
<div class="flex flex-col items-center text-center space-y-stack-gap mb-8">
<div class="flex items-center space-x-2 mb-2">
<div class="w-10 h-10 rounded-xl bg-primary-fixed flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">SafeSight</span>
</div>
<div class="space-y-1">
<h1 class="font-headline-md text-headline-md text-on-surface">Choose your language</h1>
<p class="font-body-md text-on-surface-variant max-w-sm mx-auto">Select the language you'd like to use in SafeSight. You can change this later from Settings.</p>
</div>
</div>
<div class="flex flex-col space-y-4 w-full max-w-md mx-auto">
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl border-2 border-primary cursor-pointer transition-all" id="lang-en" onclick="selectLang('en')">
<div class="flex flex-col">
<span class="font-label-md text-on-surface text-base">English</span>
<span class="font-body-md text-on-surface-variant text-sm">English</span>
</div>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary" id="radio-en">
<span class="material-symbols-outlined text-sm">check</span>
</div>
</div>
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl border-2 border-transparent cursor-pointer transition-all" id="lang-bn" onclick="selectLang('bn')">
<div class="flex flex-col">
<span class="font-label-md text-on-surface text-base">বাংলা</span>
<span class="font-body-md text-on-surface-variant text-sm">Bengali</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center text-transparent" id="radio-bn">
<span class="material-symbols-outlined text-sm">check</span>
</div>
</div>
</div>
<div class="flex flex-col space-y-4 mt-8">
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-xl font-label-md text-base flex items-center justify-center space-x-2 active:scale-[0.98] transition-transform" id="continue-btn" onclick="handleContinue()">
<span id="btn-text">Continue</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<span class="font-label-sm text-outline text-center">Version 1.0.0</span>
</div>
<script>
let currentLang = 'en';
function selectLang(lang) {
  currentLang = lang;
  const enCard = document.getElementById('lang-en');
  const bnCard = document.getElementById('lang-bn');
  const radioEn = document.getElementById('radio-en');
  const radioBn = document.getElementById('radio-bn');
  const btnText = document.getElementById('btn-text');
  
  if (lang === 'en') {
    enCard.className = 'flex items-center justify-between p-4 bg-surface-container-low rounded-xl border-2 border-primary cursor-pointer transition-all';
    radioEn.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary';
    radioEn.innerHTML = '<span class="material-symbols-outlined text-sm">check</span>';
    
    bnCard.className = 'flex items-center justify-between p-4 bg-surface-container-low rounded-xl border-2 border-transparent cursor-pointer transition-all';
    radioBn.className = 'w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center text-transparent';
    radioBn.innerHTML = '<span class="material-symbols-outlined text-sm">check</span>';
    
    btnText.textContent = 'Continue';
  } else {
    bnCard.className = 'flex items-center justify-between p-4 bg-surface-container-low rounded-xl border-2 border-primary cursor-pointer transition-all';
    radioBn.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary';
    radioBn.innerHTML = '<span class="material-symbols-outlined text-sm">check</span>';
    
    enCard.className = 'flex items-center justify-between p-4 bg-surface-container-low rounded-xl border-2 border-transparent cursor-pointer transition-all';
    radioEn.className = 'w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center text-transparent';
    radioEn.innerHTML = '<span class="material-symbols-outlined text-sm">check</span>';
    
    btnText.textContent = '\u09ফেস\u09c7\u0987\u09a4\u09c7 \u098f\u0997\u09bf\u09af\u09bc\u09c7 \u09af\u09be\u09a8' || 'এগিয়ে যান';
  }
}
function handleContinue() {
  alert(currentLang === 'en' ? 'Continuing in English...' : 'বাংলায় এগিয়ে যাওয়া হচ্ছে...');
}
</script>
</div></div></main></body></html>
