<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center">
<div class="w-full max-w-md mx-auto flex flex-col h-screen relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface flex items-center px-container-padding h-touch-target-min border-b border-outline-variant z-10">
<button class="text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform rounded-full p-2 mr-4 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary">Change Password</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-container-padding py-stack-gap overflow-y-auto pb-32">
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-gap">
                Choose a new password for your account.
            </p>
<form class="flex flex-col gap-stack-gap" onsubmit="event.preventDefault();">
<!-- Current Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface" for="current-password">Current password</label>
<div class="relative">
<input class="w-full h-touch-target-min rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-12" id="current-password" placeholder="Enter current password" required="" type="password"/>
<button class="absolute right-0 top-0 h-full px-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePassword('current-password', 'current-eye')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="current-eye">visibility</span>
</button>
</div>
</div>
<!-- New Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface" for="new-password">New password</label>
<div class="relative">
<input class="w-full h-touch-target-min rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-12" id="new-password" placeholder="Enter new password" required="" type="password"/>
<button class="absolute right-0 top-0 h-full px-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePassword('new-password', 'new-eye')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="new-eye">visibility</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Password must contain at least 8 characters</p>
</div>
<!-- Confirm New Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface" for="confirm-password">Confirm new password</label>
<div class="relative">
<input class="w-full h-touch-target-min rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-12" id="confirm-password" placeholder="Confirm new password" required="" type="password"/>
<button class="absolute right-0 top-0 h-full px-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePassword('confirm-password', 'confirm-eye')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="confirm-eye">visibility</span>
</button>
</div>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full px-container-padding py-stack-gap bg-surface/90 backdrop-blur-md border-t border-outline-variant shadow-soft sm:absolute sm:bottom-0 sm:left-auto sm:w-full z-20 pb-safe">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md h-touch-target-min rounded-[16px] flex items-center justify-center gap-2 active:scale-98 transition-transform shadow-sm hover:bg-primary/90">
                Update Password
            </button>
</div>
</div>
<script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
