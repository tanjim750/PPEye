<span class="material-symbols-outlined bg-on-primary/20 rounded-full p-1 text-[20px]" data-icon="save">save</span>
                Save Changes
            </button>
</div>
</div>
<!-- BottomNavBar (Suppressed as per rules: This is a focused sub-page/settings page, not a top-level destination. Overridden by Sticky Bottom Action) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            const saveBtn = document.querySelector('button[disabled]');
            let initialValues = {};

            inputs.forEach(input => {
                initialValues[input.id] = input.value;
                input.addEventListener('input', () => {
                    let hasChanges = false;
                    inputs.forEach(inp => {
                        if (inp.value !== initialValues[inp.id]) {
                            hasChanges = true;
                        }
                    });
                    saveBtn.disabled = !hasChanges;
                });
            });
        });
    </script>
