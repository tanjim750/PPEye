        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background antialiased font-body-md h-screen flex flex-col items-center">
<!-- Nav shell is suppressed as per The "Destination" Rule for Settings/Sub-pages -->
<div class="w-full max-w-md bg-surface h-full flex flex-col">
<!-- Top App Bar -->
<header class="flex items-center justify-between px-container-padding h-touch-target-min w-full bg-glass-bg backdrop-blur-md sticky top-0 z-10 border-b border-outline-variant shadow-soft">
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center -ml-2 text-primary active:scale-95 duration-200 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Settings</h1>
<div class="h-touch-target-min w-touch-target-min"></div> <!-- Spacer for centering -->
</header>
<!-- Main Scrollable Content -->
<main class="flex-1 overflow-y-auto w-full pb-20">
<!-- Account Identity -->
<div class="px-container-padding py-8 flex items-center gap-4 active:scale-[0.98] transition-transform duration-200 cursor-pointer">
<img alt="Mahmud Hasan" class="w-20 h-20 rounded-full border-2 border-surface object-cover shadow-soft" data-alt="A professional headshot of a male safety officer in his mid-30s. He is wearing a clean, modern high-visibility vest over a collared shirt. The lighting is bright and even, creating a clean, modern corporate portrait style against a neutral gray background. The image feels trustworthy and highly professional." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2Q3xYDKRkx8ewS8VKNmz9vrucQSDxmBCrDoGPjOBthVoiiqnCKv9B5klwIXRJM4PnMQJoDKXyCtxaGI0G-8gn-EysgHWomYUEq-msCPa5sVx9nkZ8WnQp_ECC4gt-A3mKKGUbE1GZoMWUI3t9ARmzjKnTfwChw5Pqlede-d8zoBR222AYz1TiK8NElii_GlFzTaeY0HMsiw8-mdHI1vRHS_D3WFdvBB5x0qMoQPA1NFMDpDxaRJQQ"/>
<div class="flex-1">
<h2 class="font-headline-md text-[20px] leading-[28px] font-semibold text-on-surface">Mahmud Hasan</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">EHS Representative</p>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">mahmud@example.com</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</div>
<!-- Settings Sections -->
<div class="flex flex-col">
<!-- ACCOUNT -->
<div class="pt-6">
<h3 class="px-container-padding font-label-md text-label-md text-primary uppercase tracking-wider mb-2">Account</h3>
<ul class="border-t border-outline-variant">
<li class="border-b border-outline-variant">
<button class="w-full flex items-center px-container-padding py-4 active:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-outline mr-4" style="font-variation-settings: 'FILL' 1;">person</span>
<div class="flex-1 text-left">
<div class="font-body-lg text-body-lg font-medium text-on-surface">Profile</div>
<div class="font-body-md text-body-md text-on-surface-variant">Personal information</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</li>
<li class="border-b border-outline-variant">
<button class="w-full flex items-center px-container-padding py-4 active:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-outline mr-4" style="font-variation-settings: 'FILL' 1;">lock</span>
<div class="flex-1 text-left">
<div class="font-body-lg text-body-lg font-medium text-on-surface">Change Password</div>
<div class="font-body-md text-body-md text-on-surface-variant">Update your password</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</li>
</ul>
</div>
<!-- APP -->
<div class="pt-6">
<h3 class="px-container-padding font-label-md text-label-md text-primary uppercase tracking-wider mb-2">App</h3>
<ul class="border-t border-outline-variant">
<li class="border-b border-outline-variant">
<button class="w-full flex items-center px-container-padding py-4 active:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-outline mr-4" style="font-variation-settings: 'FILL' 1;">notifications</span>
<div class="flex-1 text-left">
<div class="font-body-lg text-body-lg font-medium text-on-surface">Notifications</div>
<div class="font-body-md text-body-md text-on-surface-variant">Manage app notifications</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</li>
</ul>
</div>
<!-- SUPPORT -->
<div class="pt-6">
<h3 class="px-container-padding font-label-md text-label-md text-primary uppercase tracking-wider mb-2">Support</h3>
<ul class="border-t border-outline-variant">
<li class="border-b border-outline-variant">
<button class="w-full flex items-center px-container-padding py-4 active:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-outline mr-4" style="font-variation-settings: 'FILL' 1;">help</span>
<div class="flex-1 text-left">
<div class="font-body-lg text-body-lg font-medium text-on-surface">Help &amp; Support</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</li>
<li class="border-b border-outline-variant">
<button class="w-full flex items-center px-container-padding py-4 active:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-outline mr-4" style="font-variation-settings: 'FILL' 1;">info</span>
<div class="flex-1 text-left">
<div class="font-body-lg text-body-lg font-medium text-on-surface">About</div>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">v1.0.0</span>
</button>
</li>
</ul>
</div>
<!-- SESSION -->
<div class="pt-6 pb-8">
<h3 class="px-container-padding font-label-md text-label-md text-outline uppercase tracking-wider mb-2">Session</h3>
<ul class="border-t border-b border-outline-variant">
<li>
<button class="w-full flex items-center px-container-padding py-4 active:bg-error-container/30 transition-colors group">
<span class="material-symbols-outlined text-error mr-4 group-active:scale-95 transition-transform" style="font-variation-settings: 'FILL' 1;">logout</span>
<div class="flex-1 text-left">
<div class="font-body-lg text-body-lg font-semibold text-error">Log out</div>
</div>
</button>
</li>
</ul>
</div>
</div>
</main>
</div>
</body></html>
