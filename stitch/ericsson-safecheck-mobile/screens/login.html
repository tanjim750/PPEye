  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col flex-1 relative w-full px-container-padding bg-surface justify-center"><div class="flex flex-col w-full justify-between py-8 min-h-[707px]">
<!-- Top Brand & Header Section -->
<div class="flex flex-col items-center text-center space-y-stack-gap mb-8">
<div class="w-16 h-16 rounded-xl bg-primary-fixed flex items-center justify-center text-primary shadow-sm mb-2">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<div class="space-y-1">
<h1 class="font-headline-md text-headline-md text-on-surface">Welcome back</h1>
<p class="font-body-md text-on-surface-variant">Sign in to continue to your account.</p>
</div>
</div>
<!-- Authentication Form -->
<form class="flex flex-col space-y-6 w-full max-w-md mx-auto" onsubmit="event.preventDefault();">
<!-- Email/Phone Field -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-on-surface">Email or phone number</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-outline material-symbols-outlined">mail</span>
<input class="w-full h-touch-target-min pl-12 pr-4 bg-surface-container-low rounded-xl text-on-surface font-body-md outline-none focus:ring-2 focus:ring-primary transition-all" placeholder="Enter your email or phone" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface">Password</label>
<a class="font-label-md text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="absolute left-4 text-outline material-symbols-outlined">lock</span>
<input class="w-full h-touch-target-min pl-12 pr-12 bg-surface-container-low rounded-xl text-on-surface font-body-md outline-none focus:ring-2 focus:ring-primary transition-all" id="password-input" placeholder="Enter your password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 text-outline hover:text-on-surface flex items-center justify-center h-touch-target-min w-touch-target-min" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-xl font-label-md text-base flex items-center justify-center space-x-2 active:scale-[0.98] transition-transform" type="submit">
<span>Log in</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Footer Context & Version -->
<div class="flex flex-col items-center text-center space-y-4 mt-12">
<p class="font-body-md text-on-surface-variant">
      Need access? <a class="text-primary font-label-md hover:underline" href="#">Contact your administrator.</a>
</p>
<span class="font-label-sm text-outline">Version 1.0.0</span>
</div>
<script>
    function togglePassword() {
      const input = document.getElementById('password-input');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>
</div></main></body></html>
