<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #F7F8FA;
            color: #181c22;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Form input focus styling */
        .input-field:focus-within {
            border-color: #0082F0;
        }
        
        /* Segmented control active state styling */
        .segmented-active {
            background-color: #ffffff;
            color: #181c22;
            box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.1);
        }
        
        .segmented-inactive {
            color: #404753;
            background-color: transparent;
        }
        
        /* Custom scrollbar for web view */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d7dae3;
            border-radius: 4px;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="antialiased w-full h-screen overflow-hidden flex flex-col md:items-center bg-background pb-20">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 border-b border-outline-variant bg-surface" style="background-color: #F7F8FA;">
<div class="flex justify-between items-center h-16 px-container-padding w-full max-w-md mx-auto">
<!-- Leading Icon -->
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full text-on-surface hover:bg-surface-container-low active:scale-95 duration-200 transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Headline -->
<div class="flex flex-col flex-grow ml-2">
<h1 class="font-title-lg text-title-lg text-on-surface">Add User</h1>
<p class="font-label-md text-label-md text-on-surface-variant font-normal">Create a new account</p>
</div>
<!-- Trailing (Empty for balance or could be close) -->
<div class="w-10"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto mt-16 flex-1 overflow-y-auto pt-4 px-container-padding pb-32">
<!-- User Type Segmented Control -->
<div class="bg-surface-variant p-1 rounded-lg flex w-full mb-6 relative">
<button class="flex-1 py-2 font-label-md text-label-md rounded-md segmented-inactive transition-all text-center" id="tab-internal">
                Internal
            </button>
<button class="flex-1 py-2 font-label-md text-label-md rounded-md segmented-active transition-all text-center" id="tab-external">
                External
            </button>
</div>
<form class="flex flex-col gap-stack-gap">
<!-- Basic Information Section -->
<section class="flex flex-col gap-4">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Basic information</h2>
<div class="flex flex-col gap-4 bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/50 shadow-soft">
<!-- Full Name -->
<div class="flex flex-col gap-1.5 group input-field border-b border-outline-variant pb-2 transition-colors">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full name</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant outline-none" id="fullName" type="text" value="Rahim Mia"/>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-1.5 group input-field border-b border-outline-variant pb-2 transition-colors">
<label class="font-label-md text-label-md text-on-surface-variant" for="phone">Phone number</label>
<div class="flex items-center">
<span class="font-body-lg text-body-lg text-on-surface-variant mr-2">+880</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant outline-none" id="phone" placeholder="1712345678" type="tel"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5 group input-field pb-1 transition-colors">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant outline-none" id="email" placeholder="rahim.mia@example.com" type="email"/>
</div>
</div>
</section>
<!-- Organization Section (Progressive Disclosure - Visible for External) -->
<section class="flex flex-col gap-4 mt-2" id="section-organization">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Organization</h2>
<div class="flex flex-col gap-4 bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/50 shadow-soft">
<!-- Vendor Selection (Bottom Sheet Trigger) -->
<button class="flex flex-col gap-1.5 w-full text-left group border-b border-outline-variant pb-3 transition-colors active:opacity-70" type="button">
<label class="font-label-md text-label-md text-on-surface-variant pointer-events-none">Vendor</label>
<div class="flex items-center justify-between w-full">
<span class="font-body-lg text-body-lg text-outline-variant">Select vendor...</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</button>
<!-- Vendor ID (Optional) -->
<div class="flex flex-col gap-1.5 group input-field pb-1 transition-colors">
<label class="font-label-md text-label-md text-on-surface-variant" for="vendorId">Vendor ID (Optional)</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline-variant outline-none" id="vendorId" placeholder="e.g. V-12345" type="text"/>
</div>
</div>
</section>
<!-- Access Section -->
<section class="flex flex-col gap-4 mt-2">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Access</h2>
<div class="flex flex-col gap-4 bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/50 shadow-soft">
<!-- Role Selection (Bottom Sheet Trigger) -->
<button class="flex flex-col gap-1.5 w-full text-left group pb-1 transition-colors active:opacity-70" type="button">
<label class="font-label-md text-label-md text-on-surface-variant pointer-events-none">Role</label>
<div class="flex items-center justify-between w-full">
<span class="font-body-lg text-body-lg text-on-surface">Vendor Team Leader</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</button>
</div>
</section>
<!-- Spacer to ensure content isn't hidden behind sticky button -->
<div class="h-6"></div>
</form>
</main>
<!-- Sticky Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-glass-bg backdrop-blur-md border-t border-outline-variant/30 px-container-padding py-4 z-40">
<div class="w-full max-w-md mx-auto">
<button class="w-full bg-[#0082F0] text-on-primary font-title-lg text-title-lg rounded-xl h-[48px] min-h-[48px] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-sm">
<span class="material-symbols-outlined icon-fill text-[20px]" data-icon="person_add">person_add</span>
                Create User
            </button>
</div>
</div>
<!-- Script for basic interaction demonstration -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabInternal = document.getElementById('tab-internal');
            const tabExternal = document.getElementById('tab-external');
            const orgSection = document.getElementById('section-organization');

            tabInternal.addEventListener('click', () => {
                tabInternal.classList.remove('segmented-inactive');
                tabInternal.classList.add('segmented-active');
                
                tabExternal.classList.remove('segmented-active');
                tabExternal.classList.add('segmented-inactive');
                
                // Progressive disclosure hide
                orgSection.style.display = 'none';
            });

            tabExternal.addEventListener('click', () => {
                tabExternal.classList.remove('segmented-inactive');
                tabExternal.classList.add('segmented-active');
                
                tabInternal.classList.remove('segmented-active');
                tabInternal.classList.add('segmented-inactive');
                
                // Progressive disclosure show
                orgSection.style.display = 'flex';
            });
        });
    </script>
</body></html>
