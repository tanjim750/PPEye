<body class="h-screen w-full overflow-hidden flex flex-col text-on-surface">
<!-- TopAppBar Component -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target bg-surface/80 backdrop-blur-md border-b border-border-subtle">
<button class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-transform duration-150 active:scale-95 rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">PPE Capture</h1>
<button class="font-label-md text-label-md text-primary font-semibold hover:bg-surface-container-high transition-transform duration-150 active:scale-95 px-4 h-touch-target flex items-center rounded-lg">
            Done
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-grow relative mt-touch-target flex flex-col">
<!-- Live Camera View (75% height) -->
<div class="relative w-full flex-grow bg-black overflow-hidden" style="flex-basis: 75%;">
<!-- Camera Feed Image -->
<img alt="" class="absolute inset-0 w-full h-full object-cover opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjdoV4X_IzIszJ5Q7Ys0_A7z9Alc1L1mZMH9GGRrmsvqeCpuSDl1Az_X0d7otoeUojdCqhR1O2Gr0mqZ9z3sKPo7-m1nbguaMKGm5fuvZ_TfTgJGm-SceaB13OXXMfs92lKT7Ozps-kBLmCQWfeX5krh64l7tYXTJ-V0y-65KW-OOhXBodact3ju0SGrN3mcwjSC96cNAt9KzuQhaXf3D1CsJK7psBprZoE3Wtcac0rxpknzSBdAVf"/>
<!-- Silhouette Guide -->
<div class="absolute inset-0 w-full h-full silhouette-guide pointer-events-none"></div>
<!-- Overlay Typography -->
<div class="absolute top-stack-lg left-0 w-full text-center px-margin-mobile drop-shadow-md">
<span class="font-label-md text-label-md text-white bg-black/40 px-3 py-1 rounded-full uppercase tracking-wider inline-block mb-stack-sm backdrop-blur-sm">Worker 4</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-white uppercase tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">FRONT</h2>
<p class="font-body-md text-body-md text-white/90 mt-base drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">Capture the full body from the front</p>
</div>
</div>
<!-- Bottom Controls Area (25% height) -->
<div class="w-full bg-[#101214] pb-safe flex flex-col justify-end" style="flex-basis: 25%; min-height: 180px;">
<!-- Progress Strip -->
<div class="w-full px-margin-mobile py-stack-sm flex justify-center gap-2 items-center mb-stack-md overflow-x-auto no-scrollbar">
<div class="flex items-center gap-1 bg-surface-container-lowest/10 text-white font-label-sm text-label-sm px-3 py-1.5 rounded-full whitespace-nowrap">
                    W1 <span class="material-symbols-outlined text-[14px] text-status-safe">check</span>
</div>
<div class="flex items-center gap-1 bg-surface-container-lowest/10 text-white font-label-sm text-label-sm px-3 py-1.5 rounded-full whitespace-nowrap">
                    W2 <span class="material-symbols-outlined text-[14px] text-status-safe">check</span>
</div>
<div class="flex items-center gap-1 bg-surface-container-lowest/10 text-white font-label-sm text-label-sm px-3 py-1.5 rounded-full whitespace-nowrap">
                    W3 <span class="material-symbols-outlined text-[14px] text-status-safe">check</span>
</div>
<div class="flex items-center gap-1 bg-primary text-white font-label-sm text-label-sm px-4 py-2 rounded-full font-bold whitespace-nowrap shadow-md border border-primary-container">
                    Worker 4
                </div>

<div class="w-full px-margin-tablet pb-stack-lg flex justify-between items-center h-24">

</button>

<div class="w-[60px] h-[60px] rounded-full bg-white flex items-center justify-center">
<div class="w-[52px] h-[52px] rounded-full bg-primary border-2 border-white"></div>
</div>
</button>

<button class="w-[48px] h-[48px] rounded-full flex items-center justify-center text-white/80 hover:bg-white/10 active:scale-95 transition-all flex-shrink-0">
<span class="material-symbols-outlined text-[28px]" data-icon="flash_on">flash_on</span>
